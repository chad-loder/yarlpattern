site_name: yarlpattern
site_description: WHATWG URLPattern for Python — 100% specification strict, pure Python, optimized and yarl-compatible
site_url: https://chad-loder.github.io/yarlpattern
repo_url: https://github.com/chad-loder/yarlpattern
repo_name: chad-loder/yarlpattern
edit_uri: edit/main/docs/

validation:
  anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - code-validator:
      identifiers:
        python:
          validators:
            - "python -c \"import ast,sys; ast.parse(sys.stdin.read())\""
        bash:
          validators:
            - bash -n
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true

# Phase-1 nav. The conformance report is auto-generated by
# ``scripts/generate_compliance_report.py`` so we include it from day one.
# Comparisons / explanation / API reference land in later phases.
nav:
  - Home: index.md
  - WPT Conformance: wpt-compliance.md
